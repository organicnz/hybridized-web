# ── Install ──────────────────────────────────────────────────────────────────
[install]
# Never auto-install packages as a side effect of `bun run`.
# Dependencies are installed explicitly with `bun install`.
auto = "disable"

# When a dependency is added, record it without a semver range so the
# installed version is pinned in package.json.
exact = true

[install.cache]
# Share the install cache across projects and machines.
dir = "~/.bun/install/cache"
disable = false

# ── Run ──────────────────────────────────────────────────────────────────────
[run]
# Every package.json script executes on the Bun runtime — never Node.js.
bun = true

# Script orchestration (`&&`, `||`, redirections) runs in Bun's own shell
# instead of bash/zsh, so no system shell is required.
shell = "bun"

# ── Test ─────────────────────────────────────────────────────────────────────
[test]
timeout = 10000
