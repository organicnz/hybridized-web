name: DB Migrations

on:
  push:
    branches: [main]

jobs:
  # Vercel owns build + deploy. This workflow only keeps the database schema in
  # sync; it deliberately re-runs nothing that Vercel's build already does.
  db-migrate:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        # Bun is here for one thing: the URL-encoding of the database
        # password below. The project has no Node.js and no Python.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref neslxchdtibzhxijxcbg
          # Use connection pooler for external CI runners; DB password encoded
          ENCODED_PW=$(bun -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD ?? ""))')
          # Pooler requires tenant identifier: username = postgres.{project_ref}
          supabase db push --db-url "postgresql://postgres.neslxchdtibzhxijxcbg:${ENCODED_PW}@aws-0-us-west-1.pooler.supabase.com:6543/postgres?pgbouncer=true"
