name: DB Migrations

on:
  push:
    branches: [main]

jobs:
  # Vercel owns build + deploy. This workflow only keeps the database schema in
  # sync; it deliberately re-runs nothing that Vercel's build already does.
  db-migrate:
    name: Apply Supabase Migrations
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref neslxchdtibzhxijxcbg
          # Use connection pooler for external CI runners; DB password encoded
          ENCODED_PW=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('SUPABASE_DB_PASSWORD',''), safe=''))")
          # Pooler requires tenant identifier: username = postgres.{project_ref}
          supabase db push --db-url "postgresql://postgres.neslxchdtibzhxijxcbg:${ENCODED_PW}@aws-0-us-west-1.pooler.supabase.com:6543/postgres?pgbouncer=true"
