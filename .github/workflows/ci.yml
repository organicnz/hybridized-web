name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # Every project step runs on Bun. There is deliberately no
    # actions/setup-node: Node.js never enters the project toolchain.
    # (GitHub Actions runs its own JS actions on an internal Node runtime —
    # that is the runner's implementation detail, not a project dependency.)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (bootstrap)
        # This step only provides a Bun capable of running the installer below.
        # The "canary" channel serves unversioned assets that are replaced
        # daily, and canaries have no git tags, so setup-bun cannot resolve a
        # pinned canary — it is replaced immediately by the exact build.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install pinned Bun
        # `.bun-version` names the npm publish version of the Bun build this
        # project pins. npm forbids republishing a version, so the tarball is
        # immutable, and `.bun-lock.json` carries its sha512 for every
        # platform. The installer verifies the hash before writing the binary.
        run: bun scripts/install-bun.ts --output-dir "$HOME/.bun/bin"

      - name: Verify Bun revision
        run: bun --revision

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('.bun-lock.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Doctor (Bun environment invariants)
        run: bun run doctor

      - name: Verify (lint + typecheck + test)
        run: bun run verify

      - name: Build
        run: bun run build

      - name: Audit dependencies
        # Reporting only — advisories should not block a deploy on their own.
        continue-on-error: true
        run: bun audit --audit-level=high

  shaders:
    name: Shader Validation
    runs-on: ubuntu-latest
    needs: verify
    # `bun run shader:check` validates the WGSL sources offline, so it needs
    # no GPU adapter. It stays non-blocking so a shader regression never
    # holds up a deploy.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (bootstrap)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install pinned Bun
        run: bun scripts/install-bun.ts --output-dir "$HOME/.bun/bin"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `next build` never validates WGSL, so validate it here.
      - name: Validate WGSL
        run: bun run shader:check
