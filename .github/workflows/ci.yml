name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # Every project step runs on Bun. There is deliberately no
    # actions/setup-node: Node.js never enters the project toolchain.
    # (GitHub Actions runs its own JS actions on an internal Node runtime —
    # that is the runner's implementation detail, not a project dependency.)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (bootstrap)
        # This step only provides a Bun capable of running the installer below.
        # The "canary" channel serves unversioned assets that are replaced
        # daily, and canaries have no git tags, so setup-bun cannot resolve a
        # pinned canary — it is replaced immediately by the exact build.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install pinned Bun
        # `.bun-version` names the npm publish version of the Bun build this
        # project pins. npm forbids republishing a version, so the tarball is
        # immutable, and `.bun-lock.json` carries its sha512 for every
        # platform. The installer verifies the hash before writing the binary.
        run: bun scripts/install-bun.ts --output-dir "$HOME/.bun/bin"

      - name: Verify Bun revision
        run: bun --revision

      - name: Cache Bun install cache
        # The install cache holds the tarballs the isolated linker
        # materialises from, so this one cache covers the whole install.
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('.bun-lock.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Deno
        # The Supabase edge functions run on Deno — the Supabase edge runtime
        # is Deno — so they are type-checked and linted with the runtime that
        # will actually execute them. Bun cannot resolve their `jsr:` imports.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge functions (typecheck + lint)
        run: |
          bun run typecheck:edge
          bun run lint:edge

      - name: Doctor (Bun environment invariants)
        run: bun run doctor

      - name: Verify (lint + typecheck + test)
        run: bun run verify

      - name: Coverage
        # `scripts/coverage.ts` runs the suite and enforces the floor declared
        # in bunfig.toml, so this step fails when a new module lands without
        # tests.
        run: bun run test:coverage

      - name: Build
        # The build prerenders pages that read Supabase, so it needs the
        # public URL and anon key. The service-role key is not needed: the
        # only code path that uses it lives in a dynamic route handler.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: bun run build

      - name: Audit dependencies
        # Reporting only — advisories should not block a deploy on their own.
        continue-on-error: true
        run: bun audit --audit-level=high

  secrets:
    name: Secret Audit
    runs-on: ubuntu-latest

    # A credential that was committed is in the history forever. The working
    # tree is checked by the doctor on every change; this walks every object
    # the repository has ever held, so a secret that was committed and later
    # removed cannot be forgotten.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history — a shallow clone has nothing to audit.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install pinned Bun
        run: bun scripts/install-bun.ts --output-dir "$HOME/.bun/bin"

      - name: Audit the history for credentials
        run: bun run audit:secrets

  migrations:
    name: Migration Chain
    runs-on: ubuntu-latest
    needs: verify

    # The Supabase migrations are the schema, and the generated types are the
    # contract the application reads. This applies the whole chain to a
    # throwaway Postgres and compares the result with the contract, so a
    # migration that assumes a table or a column nobody creates cannot pass.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install pinned Bun
        run: bun scripts/install-bun.ts --output-dir "$HOME/.bun/bin"

      - name: Setup Postgres
        uses: shogo82148/actions-setup-postgresql@v2
        with:
          postgresql-version: "18"

      - name: Check the migration chain
        run: bun run check:migrations

  shaders:
    name: Shader Validation
    runs-on: ubuntu-latest
    needs: verify
    # `bun run shader:check` validates the WGSL sources offline, so it needs
    # no GPU adapter. It stays non-blocking so a shader regression never
    # holds up a deploy.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (bootstrap)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install pinned Bun
        run: bun scripts/install-bun.ts --output-dir "$HOME/.bun/bin"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install a software Vulkan renderer
        # GitHub's hosted runners have no GPU and no Vulkan driver, so Dawn
        # cannot acquire an adapter and `--require-validation` would fail
        # with VGPU-WGSL-VALIDATE-NO-DEVICE. Mesa's lavapipe is a CPU Vulkan
        # implementation; installing it gives Dawn a device to validate
        # against. This is the alternative vgpu's own doctor prescribes.
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libdrm2 zlib1g libzstd1 libudev1 mesa-vulkan-drivers
          ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)
          echo "Vulkan ICD: $ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"

      # `next build` never validates WGSL, so validate it here.
      - name: Validate WGSL
        run: bun run shader:check
