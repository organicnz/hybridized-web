name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # Every project step runs on Bun. There is deliberately no
    # actions/setup-node: Node.js never enters the project toolchain.
    # (GitHub Actions runs its own JS actions on an internal Node runtime —
    # that is the runner's implementation detail, not a project dependency.)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        # The project tracks the Bun canary channel: `.bun-version` is
        # "latest" for mise locally, and CI installs the canary channel.
        # `package.json` pins the exact canary build for the lockfile layer.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Doctor (Bun environment invariants)
        run: bun run doctor

      - name: Verify (lint + typecheck + test)
        run: bun run verify

      - name: Build
        run: bun run build

      - name: Audit dependencies
        # Reporting only — advisories should not block a deploy on their own.
        continue-on-error: true
        run: bun audit --audit-level=high
