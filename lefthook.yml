# Lefthook Configuration — Bun only
#
# Every tool is executed through Bun, either as a built-in (`bun fmt`,
# `bun lint`) or through `bun x --bun` for the npm-distributed ones, which
# forces the Bun runtime instead of Node.js. The project has no Node.js
# dependency at all.

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,jsx,tsx,json,css,md}"
      run: bun fmt --no-error-on-unmatched-pattern {staged_files}

    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: bun lint --no-script -c oxlint.json --no-error-on-unmatched-pattern {staged_files}

    type-check:
      glob: "*.{ts,tsx}"
      run: bun x --bun tsrs --noEmit

pre-push:
  parallel: false
  commands:
    test:
      run: bun test

    build:
      run: bun run build
